repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.7.0
  hooks:
    - id: ruff
      args: [ --fix ]
    - id: ruff-format
- repo: local
  hooks:
    - id: docs-check
      name: docs-check (código exige documentação)
      entry: uv run python scripts/docs_check.py
      language: system
      pass_filenames: false
      always_run: true
    - id: pytest-unit
      name: pytest-unit
      entry: uv run pytest
      language: system
      types: [ python ]
      pass_filenames: false
      always_run: false
